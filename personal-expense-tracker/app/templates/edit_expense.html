{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}
    <h2>Edit Expense</h2>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="POST"
        action="{{ url_for('main.edit_expense', expense_id=expense.id) }}">

        <label for="description">Description</label>
        <input
            type="text"
            id="description"
            name="description"
            maxlength="200"
            value="{{ request.form.get('description', expense.description) }}"
            required
        >

        <label for="amount">Amount (RWF)</label>
        <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            value="{{ request.form.get('amount', expense.amount) }}"
            required
        >

        <label for="category">Category</label>
        {% set selected_category = request.form.get('category', expense.category) %}
        <select id="category" name="category" required>
            <option value="">Select a category</option>
            {% for category in ['Food', 'Transport', 'Housing', 'Education', 'Health', 'Shopping', 'Other'] %}
                <option value="{{ category }}"
                    {% if selected_category == category %}selected{% endif %}>
                    {{ category }}
                </option>
            {% endfor %}
        </select>

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            name="date"
            value="{{ request.form.get('date', expense.date.isoformat()) }}"
            required
        >

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('main.index') }}">Cancel</a>
    </form>
{% endblock %}
