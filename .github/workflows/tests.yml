name: Personal Expense Tracker CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: personal-expense-tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-expense-tracker/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
